services:
  mysql:
    image: mysql:8.4
    container_name: monify-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monify
      MYSQL_USER: monify_user
      MYSQL_PASSWORD: monify_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: